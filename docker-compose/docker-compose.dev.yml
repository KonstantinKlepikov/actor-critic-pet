version: "3"

name: actor-critic-pet-dev

services:

  actor-critic-pet-dev:
    env_file: .env
    restart: unless-stopped
    build:
      context: ".."
      dockerfile: "./docker-compose/Dockerfile.base"
    environment:
      # Ollama settings
      - OLLAMA_MODEL=${OLLAMA_MODEL?Variable not set}
      - OLLAMA_TIMEOUT=${OLLAMA_TIMEOUT:-120}
      - LLM_POOL_SIZE=${LLM_POOL_SIZE:-0}
      # App settings
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./ollama_models:/root/.ollama
      - ../src:/app/src
      - ../tests:/app/tests
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8550"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
    - actor-critic-pet-dev-network

networks:
  actor-critic-pet-dev-network:
